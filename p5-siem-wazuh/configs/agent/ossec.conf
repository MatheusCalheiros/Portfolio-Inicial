<!--
  ossec.conf — Configuração do agente Wazuh para Windows Server (DC)
  Arquivo: C:\Program Files (x86)\ossec-agent\ossec.conf

  Monitora:
    - Log de Segurança do Windows (eventos de autenticação, AD, GPO)
    - Log de Sistema
    - Log de Aplicação
    - Arquivos críticos do AD (FIM)
    - Pasta SYSVOL (GPOs)
-->

<ossec_config>

  <!-- ─── Conexão com o servidor Wazuh ──────────────────────────── -->
  <client>
    <server>
      <address>192.168.10.20</address>  <!-- IP da VM Ubuntu com Wazuh -->
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>windows, windows-server, windows-server-2022</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
  </client>

  <!-- ─── Logs de eventos do Windows ───────────────────────────── -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <!-- EventIDs monitorados:
         4624/4625 = logon ok/falha
         4634      = logoff
         4720-4726 = gerenciamento de contas
         4728/4729/4732/4733 = grupos
         4740      = lockout
         4756      = universal group change
         5136      = AD object change
         5145      = acesso a compartilhamento
         4663      = acesso a objeto/arquivo
         4698/4702 = criação/modificação de tarefa agendada
    -->
    <query>
      Event[
        System[
          (EventID=4624) or (EventID=4625) or (EventID=4634) or
          (EventID=4720) or (EventID=4721) or (EventID=4722) or
          (EventID=4723) or (EventID=4724) or (EventID=4725) or
          (EventID=4726) or (EventID=4728) or (EventID=4729) or
          (EventID=4732) or (EventID=4733) or (EventID=4740) or
          (EventID=4756) or (EventID=5136) or (EventID=5145) or
          (EventID=4663) or (EventID=4698) or (EventID=4702)
        ]
      ]
    </query>
  </localfile>

  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>Application</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Active Directory specific logs -->
  <localfile>
    <location>Directory Service</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>DNS Server</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- ─── File Integrity Monitoring (FIM) ─────────────────────── -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>3600</frequency>  <!-- verificar integridade a cada hora -->
    <scan_on_start>yes</scan_on_start>

    <!-- Banco de dados do AD — qualquer modificação é crítica -->
    <directories check_all="yes" realtime="yes" report_changes="yes">
      C:\Windows\NTDS
    </directories>

    <!-- GPOs e scripts de logon -->
    <directories check_all="yes" realtime="yes">
      C:\Windows\SYSVOL
    </directories>

    <!-- Binários do sistema — detectar substituição (DLL hijacking) -->
    <directories check_all="yes">
      C:\Windows\System32
    </directories>

    <!-- Scripts administrativos do projeto -->
    <directories check_all="yes" realtime="yes" report_changes="yes">
      C:\AdminScripts
    </directories>

    <!-- Ignorar arquivos que mudam constantemente -->
    <ignore>C:\Windows\System32\LogFiles</ignore>
    <ignore>C:\Windows\System32\wbem\Logs</ignore>
    <ignore>C:\Windows\System32\GroupPolicy\DataStore</ignore>

    <!-- Alertar se checksum mudar em executáveis críticos -->
    <nodiff>C:\Windows\System32\lsass.exe</nodiff>
    <nodiff>C:\Windows\System32\ntoskrnl.exe</nodiff>
  </syscheck>

  <!-- ─── Verificações de conformidade ─────────────────────────── -->
  <wodle name="cis-cat">
    <disabled>yes</disabled>  <!-- habilitar se tiver licença CIS-CAT Pro -->
  </wodle>

  <!-- Windows Security Center -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="no">yes</ports>
    <processes>yes</processes>
    <hotfixes>yes</hotfixes>
  </wodle>

  <!-- ─── Módulo de vulnerabilidades ───────────────────────────── -->
  <vulnerability-detector>
    <enabled>yes</enabled>
    <interval>12h</interval>
    <run_on_start>yes</run_on_start>
    <provider name="nvd">
      <enabled>yes</enabled>
      <update_interval>1h</update_interval>
    </provider>
  </vulnerability-detector>

  <!-- ─── Active responses ─────────────────────────────────────── -->
  <!-- Bloquear IP após brute force detectado (regra 100101) -->
  <active-response>
    <command>netsh-win-2016</command>
    <location>local</location>
    <rules_id>100101,100102</rules_id>
    <timeout>600</timeout>  <!-- bloquear por 10 minutos -->
  </active-response>

</ossec_config>
